spring.application.name=apicalendario

# Puerto del servicio web
server.port=${PUERTO:8080}

# Base de datos PostgreSQL. Cada valor se puede sobrescribir con una variable de entorno
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${BD_SERVIDOR:localhost}:${BD_PUERTO:5432}/${BD_BASEDATOS:calendario}
spring.datasource.username=${BD_USUARIO:postgres}
spring.datasource.password=${BD_CLAVE:sa}

# Las tablas las crean los scripts de la carpeta bd. JPA solo valida que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Servicio externo: URL de la API Festivos
servicioexterno.festivos.url=${API_FESTIVOS_URL:http://localhost:3030}
